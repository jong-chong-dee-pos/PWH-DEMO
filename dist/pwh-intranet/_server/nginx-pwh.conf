# Nginx settings for PWH. Copy into /etc/nginx/conf.d/ and change server_name, root and the certificate paths.
server {
    listen 443 ssl;
    server_name pwh.company.local;
    ssl_certificate     /etc/nginx/certs/pwh.crt;
    ssl_certificate_key /etc/nginx/certs/pwh.key;

    root /var/www/pwh;
    index index.html;
    types { font/woff2 woff2; }

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-cache" always;

    location / { try_files $uri $uri/ =404; }
    location /_server/ { deny all; }
}
server { listen 80; server_name pwh.company.local; return 301 https://$host$request_uri; }
